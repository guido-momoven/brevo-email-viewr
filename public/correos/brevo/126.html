<html><body><h1>Hola {{ params.nombre }}, mira estas motos</h1>

{% for moto in params.motos %}
  <div style="border:1px solid #ddd; padding:12px; margin:10px 0;">
    <img src="{{ moto.imagen_url }}" width="200" />
    <h3>{{ moto.marca }} {{ moto.modelo }}</h3>
    <p>{{ moto.ciudad }} · {{ moto.precio_dia }}€/día</p>
    <a href="{{ moto.url_ficha }}">Ver moto</a>
  </div>
{% endfor %}</body></html>
